[package]
name = "cpppg"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.45", features = ["derive"] }
clap_derive = "4.5.45"
regex = "1.11.2"
macros = { path = "./macros" }
toml = "0.9.5"
serde = { version = "1.0.219", features = ["derive", "serde_derive"] }
heck = "0.5.0"

[workspace]
members = ["macros"]

[dev-dependencies]
tempfile = "3.21.0"
