[package]
name = "c3pg"
version = "0.3.1"
edition = "2021"
description = "A Cargo-inspired build tool for C++ projects, powered by CMake and Conan"
license = "MIT"
repository = "https://github.com/thedavidhk/c3pg"
readme = "README.md"
keywords = ["cpp", "cmake", "conan", "build-tool"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.45", features = ["derive"] }
clap_derive = "4.5.45"
regex = "1.11.2"
c3pg-macros = { version = "0.1.0", path = "./macros" }
toml = "1.0"
serde = { version = "1.0.219", features = ["derive", "serde_derive"] }
heck = "0.5.0"
log = "0.4.27"
clap-verbosity-flag = "3.0.4"
env_logger = "0.11.8"
semver = "1.0.26"
walkdir = "2.5.0"

[workspace]
members = ["macros"]

[dev-dependencies]
tempfile = "3.21.0"
assert_cmd = "2"
predicates = "3"
